<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imposter</title><style>body{font-family:system-ui;background:#111827;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#1f2937;padding:28px;border-radius:20px;width:min(420px,90%);box-sizing:border-box}input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:0;font-size:16px}button{background:#8b5cf6;color:white;font-weight:700;cursor:pointer}.secondary{background:#374151}h1{text-align:center}.hidden{display:none}.word{font-size:40px;text-align:center;padding:25px;background:#111827;border-radius:15px;margin:15px 0}.muted{color:#cbd5e1}.player{padding:8px;background:#374151;border-radius:8px;margin:5px 0}</style></head><body><main class="card"><h1>🎭 Imposter</h1><section id="home"><input id="name" placeholder="Your name"><button onclick="create()">Create room</button><input id="code" placeholder="Room code"><button class="secondary" onclick="join()">Join room</button></section><section id="room" class="hidden"><p>Room: <b id="roomCode"></b></p><p class="muted">Share this code with your friends.</p><div id="players"></div><button id="start" onclick="start()">Start game</button><div id="secret" class="hidden"><p class="muted">Your secret word:</p><div class="word" id="word">••••••</div><p id="role" class="muted"></p></div><button class="secondary" onclick="resetGame()">New round</button></section><p id="msg" class="muted"></p></main><script src="/socket.io/socket.io.js"></script><script>const socket=io();let room,me;const $=id=>document.getElementById(id);function msg(x){$('msg').textContent=x}function create(){socket.emit('create',{name:$('name').value})}function join(){socket.emit('join',{name:$('name').value,code:$('code').value})}function start(){socket.emit('start')}function resetGame(){socket.emit('reset');$('secret').classList.add('hidden')}socket.on('joined',x=>{room=x;me=x.you;$('home').classList.add('hidden');$('room').classList.remove('hidden');$('roomCode').textContent=x.code;render(x)});socket.on('state',render);function render(x){if(!x)return;$('roomCode').textContent=x.code;$('players').innerHTML=x.players.map(p=>`<div class="player">${p.name}${p.id===x.host?' 👑':''}${p.hasWord?' ✅':''}</div>`).join('');$('start').style.display=x.host===me&&!x.started?'block':'none'}socket.on('privateWord',x=>{$('secret').classList.remove('hidden');$('word').textContent=x.word;$('role').textContent=x.role==='imposter'?'You are the IMPOSTER 🤫':'You are a regular player';msg('Give a one-word clue when it is your turn.')});socket.on('errorMsg',msg)</script></body></html>
